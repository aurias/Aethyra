// Aethyra hue balance: PROVISIONAL test tuning, not established lore.
// Every number here is a reversible test default (see
// docs/decision-ledger.md). Change balance_version when values change.
balance_version: 1

// Mastery capability rows; a character uses the highest row whose
// mastery is <= theirs. Columns:
//   mastery capacity regen_per_tick personal_current allowance flow_pct
// capacity: personal reserve size; regen: energy per regen tick in open
// air; personal_current: the most current the character channels alone;
// allowance: simultaneous activations of this hue; flow_pct: added to the
// safe current of selected vessels.
mastery_row: 1 60 3 6 1 0
mastery_row: 5 80 4 8 1 10
mastery_row: 10 110 5 11 2 20
mastery_row: 20 160 7 16 2 35
mastery_row: 30 220 9 21 3 50
mastery_row: 50 320 12 30 4 80

// Character-wide ceiling on simultaneous activations, whatever the hues.
activation_ceiling: 3

regen_interval_ms: 1000

// Mastery progress: going from mastery m to m+1 needs m * this.
mastery_xp_per_level: 20

// Skill points per character level gained (recovered: one per level).
skill_points_per_level: 1

// Anti-repetition for awards: each award for the same skill within the
// window lowers the next by decay_pct, down to floor_pct.
award_window_ms: 60000
award_decay_pct: 15
award_floor_pct: 25

// Overload (vessel delivering above its safe current). ratio = demanded /
// safe current. Above max_ratio the attempt is refused outright.
overload_max_ratio_pct: 300
// Chance the participating stack is destroyed:
//   base + slope * (ratio - 1) - mastery_pct * mastery     (clamped 0..98)
destroy_base_pct: 35
destroy_slope_pct: 50
destroy_mastery_pct: 1
// Chance the action itself succeeds:
//   base - slope * (ratio - 1) + mastery_pct * mastery     (clamped 2..100)
success_base_pct: 90
success_slope_pct: 30
success_mastery_pct: 1
// Condition lost by a surviving stack per 100% of overload.
overload_wear: 40

// Forced falls (Gust off a ledge): reach in levels and cliff cells; the
// stagger added on landing; damage as percent of max HP (0: none - the
// recovered design leaves fall harm undecided).
ledge_fall_max_levels: 3
ledge_fall_max_span: 3
fall_stagger_ms: 2000
fall_damage_pct: 0

// Burning (Spark): ticks of damage after ignition.
burn_tick_ms: 1000
burn_ticks: 3
burn_tick_damage: 2

// --- Progression framework (v0.1, provisional) ---
// Dissonance: holding hue B weakens hue A by their pair's percentage,
// scaled by B's mastery relative to A's (at most 100%), capped in total.
dissonance_neutral_pct: 8
dissonance_max_pct: 40
// Regeneration by local concentration of the hue (0-100):
// regen% = regen_base_pct + concentration * regen_per_conc_pct / 100.
regen_base_pct: 50
regen_per_conc_pct: 250
// Personal mastery cap at first access; feats raise it.
personal_cap_start: 15
mastery_max: 50
// Above the soft cap (lower of zone training limit and personal cap) each
// level halves mastery gains.
// Systemic novelty: a never-before combination at this concentration or
// more raises the hue's personal cap.
novelty_min_conc: 40
novelty_cap_raise: 1
// Body stats: xp to the next level = body_xp_base * level.
body_xp_base: 25
// Unarmed / basic attack.
attack_min: 3
attack_max: 6
base_hp: 60
move_ms: 150
